name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end in a real browser
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Branded Chrome ignores --load-extension; Chrome for Testing does not.
      - name: Install Chrome for Testing
        id: chrome
        run: |
          out=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/browsers")
          echo "$out"
          echo "path=$(echo "$out" | tail -n 1 | cut -d' ' -f2-)" >> "$GITHUB_OUTPUT"
      - run: npm run test:e2e
        env:
          LINKTRAIL_BROWSER: ${{ steps.chrome.outputs.path }}
          LINKTRAIL_BROWSER_ARGS: --no-sandbox
