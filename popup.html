<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; width: 340px; color: #222; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 14px; margin: 0; }
  .privacy { font-size: 11px; background: #e7f7f3; color: #134e40; border-radius: 6px; padding: 6px 8px; margin: 8px 0; line-height: 1.4; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .toggle { font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .spacer { flex: 1; }
  #info { font-size: 11px; color: #666; margin: 6px 0; }
  #search { width: 100%; box-sizing: border-box; padding: 6px 8px; margin: 6px 0; }
  #results { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
  #results li { padding: 6px 4px; border-bottom: 1px solid #eee; cursor: pointer; }
  #results li:hover { background: #f3f6ff; }
  .title { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .url { font-size: 11px; color: #1d6b3a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 10px; color: #777; }
  .empty { font-size: 12px; color: #777; padding: 10px 4px; cursor: default; }
  button { padding: 5px 9px; font-size: 12px; cursor: pointer; }
  .link { background: none; border: none; color: #06c; padding: 0; text-decoration: underline; }
  .danger { color: #b00; }
</style>
</head>
<body>
  <header>
    <h1>TabJournal</h1>
    <label class="toggle"><input id="recording" type="checkbox"> Recording</label>
  </header>

  <div class="privacy">
    <strong>Stays on this device.</strong> Nothing is ever uploaded: no servers,
    accounts, or tracking. Addresses are saved without query strings, page
    titles are saved (you can turn that off), and private windows are never recorded.
  </div>

  <div class="bar">
    <button id="export">Export JSON</button>
    <button id="settings" class="link">Settings</button>
    <span class="spacer"></span>
    <button id="clear" class="link danger">Delete all data</button>
  </div>

  <div id="info"></div>
  <input id="search" type="search" placeholder="Search saved links by title or address…" autofocus>
  <ul id="results"></ul>
  <script src="popup.js" type="module"></script>
</body>
</html>
